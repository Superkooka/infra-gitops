apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican-panel
  namespace: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pelican-panel
  template:
    metadata:
      labels:
        app: pelican-panel
    spec:
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82

      containers:
        - name: pelican
          image: ghcr.io/pelican/panel:v1.0.0-rc.1@sha256:6cdbd674c14221b760da980cbeecab1982cdd1d38746ae204306fe156b19239d
          env:
            - name: BEHIND_PROXY
              value: "true"
            - name: TRUSTED_PROXY
              value: "10.42.0.0/16"
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
      volumes:
        - name: caddy-config
          configMap:
            name: pelican-panel-caddy
