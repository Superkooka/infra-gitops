apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican-panel
  namespace: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pelican-panel
  template:
    metadata:
      labels:
        app: pelican-panel
    spec:
      securityContext:
        fsGroup: 33

      containers:
        - name: pelican
          image: ghcr.io/pelican-dev/panel:v1.0.0-beta33@sha256:871032c289b7e00a23e1eb701772603750a14b8c7cfa72b072058ce645c41032
          env:
            - name: BEHIND_PROXY
              value: "true"
            - name: TRUSTED_PROXY
              value: "10.42.0.0/16"
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

        - name: pelican-queue-worker
          image: ghcr.io/pelican-dev/panel:v1.0.0-beta33@sha256:871032c289b7e00a23e1eb701772603750a14b8c7cfa72b072058ce645c41032
          command:
            [
              "php",
              "/var/www/html/artisan",
              "queue:work",
              "--sleep=3",
              "--tries=3",
              "--max-time=3600",
            ]
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
