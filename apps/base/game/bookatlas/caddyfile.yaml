apiVersion: v1
kind: ConfigMap
metadata:
  name: bookatlas-caddy
  namespace: game
data:
  Caddyfile: |
    {
        admin off
        auto_https off
        servers {
            trusted_proxies static 10.42.0.0/16
        }
    }

    # Site: /srv/current is a symlink to /srv/releases/<id>, swapped atomically on deploy.
    :8080 {
        root * /srv/current
        encode zstd gzip

        @html path / *.html */
        header @html Cache-Control "no-cache"

        file_server {
            precompressed br zstd gzip
        }
    }

    # Probes, kept off the site port so they work before the first release.
    :8081 {
        respond /healthz "ok" 200
    }
