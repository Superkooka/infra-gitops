apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookatlas
  namespace: game
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookatlas
  template:
    metadata:
      labels:
        app: bookatlas
      annotations:
        kubectl.kubernetes.io/default-container: caddy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: caddy
          image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # The caddy binary carries a cap_net_bind_service file capability:
              # exec fails with "operation not permitted" if it is not in the bounding set.
              add: ["NET_BIND_SERVICE"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-state
              mountPath: /config

        # Target of the deploy script (kubectl exec -c uploader). Uploads and extraction run
        # here with their own memory limit, so they cannot get the caddy container OOM-killed.
        # Same image as caddy: it ships the busybox tools the script uses.
        - name: uploader
          image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
          command: ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 3600 & wait $!; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddy-config
          configMap:
            name: bookatlas-caddy
        - name: caddy-data
          emptyDir: {}
        - name: caddy-state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
