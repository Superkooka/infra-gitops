apiVersion: v1
kind: Service
metadata:
  name: ts3server-service
  namespace: game
spec:
  selector:
    app: ts3server
  ports:
    - name: voice
      port: 9987
      targetPort: 9987
      protocol: UDP
    - name: filetransfer
      port: 30033
      targetPort: 30033
      protocol: TCP
    - name: query
      port: 10011
      targetPort: 10011
      protocol: TCP
