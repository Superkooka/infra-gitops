apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican-wings
  namespace: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pelican-wings
  template:
    metadata:
      labels:
        app: pelican-wings
    spec:
      containers:
        - name: wings
          image: ghcr.io/pelican/wings:v1.0.0-rc.1@sha256:cf62cae99329dde1a0507d144fc5fb0c5e9d6c8346e6987d67dc08bc323e5644
          tty: true

          env:
            - name: TZ
              value: "UTC"
            - name: WINGS_UID
              value: "988"
            - name: WINGS_GID
              value: "988"
            - name: WINGS_USERNAME
              value: "pelican"

          ports:
            - containerPort: 80
              name: http
            - containerPort: 2022
              name: sftp

          securityContext:
            privileged: true

          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: docker-containers
              mountPath: /var/lib/docker/containers/

      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers/
