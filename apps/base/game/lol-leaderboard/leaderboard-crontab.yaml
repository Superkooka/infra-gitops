apiVersion: batch/v1
kind: CronJob
metadata:
  name: leaderboard-cronjob
  namespace: game
spec:
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1

      template:
        spec:
          restartPolicy: Never

          containers:
            - name: generate-leaderboard
              image: forge.superkooka.com/superkooka/lol-leaderboard:1.0.0-alpha1@sha256:ce707decec9215550751552bb1f9c7ebdd467bf5c9acaba31e1527049f2d1c90
              imagePullPolicy: IfNotPresent

              command:
                - php
                - application.php
                - app:generate-leaderboard

              args:
                - "-n"
