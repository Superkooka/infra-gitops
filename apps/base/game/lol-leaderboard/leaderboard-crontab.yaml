apiVersion: batch/v1
kind: CronJob
metadata:
  name: leaderboard-cronjob
  namespace: game
spec:
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1

      template:
        spec:
          restartPolicy: Never

          containers:
            - name: generate-leaderboard
              image: forge.superkooka.com/superkooka/lol-leaderboard:1.0.0-alpha6@sha256:2a59d2df58bf78a664583c90e1212626467aaaf295e358bca37eec17ec147c46
              imagePullPolicy: IfNotPresent

              command:
                - php
                - application.php
                - app:generate-leaderboard

              args:
                - "-n"
