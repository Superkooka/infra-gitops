apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-helm-release
  namespace: media
spec:
  interval: 5m
  chart:
    spec:
      chart: jellyfin
      version: "2.7.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin-helm-repository
        namespace: flux-system
      interval: 5m
  values:
    podSpec:
      runtimeClassName: nvidia
    resources:
      limits:
        nvidia.com/gpu: 1

    env:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
