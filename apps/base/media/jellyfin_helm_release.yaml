apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-helm-release
  namespace: media
spec:
  interval: 5m
  chart:
    spec:
      chart: jellyfin
      version: "2.7.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin-helm-repository
        namespace: flux-system
      interval: 5m
  values:
    podSpec:
      runtimeClassName: nvidia
    resources:
      limits:
        nvidia.com/gpu: 1

    env:
      JELLYFIN_CACHE_DIR: /var/cache/jellyfin
      JELLYFIN_CONFIG_DIR: /etc/jellyfin
      JELLYFIN_DATA_DIR: /var/lib/jellyfin
      JELLYFIN_LOG_DIR: /var/log/jellyfin
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"

    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

    persistence:
      config:
        enabled: true
        type: hostPath
        hostPath: /etc/jellyfin
        mountPath: /etc/jellyfin
      cache:
        enabled: true
        type: hostPath
        hostPath: /var/cache/jellyfin
        mountPath: /var/cache/jellyfin
      data:
        enabled: true
        type: hostPath
        hostPath: /var/lib/jellyfin
        mountPath: /var/lib/jellyfin
      logs:
        enabled: true
        type: hostPath
        hostPath: /var/log/jellyfin
        mountPath: /var/log/jellyfin
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/md0
        mountPath: /mnt/md0
      media-temp:
        enabled: true
        type: hostPath
        hostPath: /media/temp
        mountPath: /media/temp
