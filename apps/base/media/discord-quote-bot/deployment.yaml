apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-quote-bot
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-quote-bot
  template:
    metadata:
      labels:
        app: discord-quote-bot
    spec:
      initContainers:
        - name: migrate
          image: forge.superkooka.com/superkooka/discord-quote-bot:1.1.0@sha256:bbae29d1c6589e00d22f9099336ec94b72cf5d4a90392cc9d50d4e5a0130b387
          command:
            - /usr/local/bin/migrate
            - up
          env:
            - name: TZ
              value: "UTC"
      containers:
        - name: discord-quote-bot
          image: forge.superkooka.com/superkooka/discord-quote-bot:1.1.0@sha256:bbae29d1c6589e00d22f9099336ec94b72cf5d4a90392cc9d50d4e5a0130b387

          env:
            - name: TZ
              value: "UTC"

          ports:
            - containerPort: 9000
              name: interaction-api
