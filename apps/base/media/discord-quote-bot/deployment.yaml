apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-quote-bot
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-quote-bot
  template:
    metadata:
      labels:
        app: discord-quote-bot
    spec:
      initContainers:
        - name: migrate
          image: forge.superkooka.com/superkooka/discord-quote-bot:dirty-latest@sha256:b7726657ec046ea3889214815d6d003cea66c72b487a5fdc84b4ee9e7c194267
          command:
            - /usr/local/bin/migrate
            - up
          env:
            - name: TZ
              value: "UTC"
      containers:
        - name: discord-quote-bot
          image: forge.superkooka.com/superkooka/discord-quote-bot:dirty-latest@sha256:b7726657ec046ea3889214815d6d003cea66c72b487a5fdc84b4ee9e7c194267

          env:
            - name: TZ
              value: "UTC"

          ports:
            - containerPort: 9000
              name: interaction-api
