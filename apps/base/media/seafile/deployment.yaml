apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seafile
  template:
    metadata:
      labels:
        app: seafile
    spec:
      containers:
        - name: seafile
          image: seafileltd/seafile-mc:13.0.25@sha256:90c1aaa08731116750cd7ce16cbc6afe0c26006433002d3c7215a5f4254ec244
          ports:
            - containerPort: 80
          env:
            - name: WAIT_FOR_DB
              value: "true"

            - name: SEAFILE_MYSQL_DB_HOST
              value: "127.0.0.1"
            - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
              value: ccnet_db
            - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
              value: seafile_db
            - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
              value: seahub_db

            # Cache (Valkey)
            - name: REDIS_HOST
              value: "127.0.0.1"
            - name: REDIS_PORT
              value: "6379"

            # Memcached
            - name: MEMCACHED_HOST
              value: "127.0.0.1"

            # Fuse option (montage FS)
            - name: SEAFILE_USE_FUSE
              value: "false"

        - name: mariadb
          image: mariadb:12.3.2@sha256:759869cb6f003234a95c6384cdee245b4bce7de26913fe607a8110362c0c007d
          ports:
            - containerPort: 3306

        - name: valkey
          image: valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
          ports:
            - containerPort: 6379
          args:
            - "--save"
            - "60"
            - "1"

        - name: memcached
          image: memcached:1.6.45@sha256:eeb9eaa939ffaa2304899674c9e88a9247ec8e5e40e424a892df7b09914bd2ec
          ports:
            - containerPort: 11211
          args:
            - "-m"
            - "256" # MB
