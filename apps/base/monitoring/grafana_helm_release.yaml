apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-helm-release
  namespace: monitoring
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: grafana-helm-repository
    namespace: flux-system
  # https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
  values:
    deploymentStrategy:
      type: Recreate
    persistence:
      type: pvc
      enabled: true
    rbac:
      pspEnabled: false

    serviceMonitor:
      enabled: true

    # datasources (Prometheus, Alertmanager) and dashboards are provisioned
    # from labelled ConfigMaps, mostly shipped by kube-prometheus-stack
    sidecar:
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true

    grafana.ini:
      plugins:
          enabled: false
