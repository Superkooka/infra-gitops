apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-pages
  namespace: forge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-pages
  template:
    metadata:
      labels:
        app: git-pages
    spec:
      containers:
        - name: git-pages
          image: codeberg.org/git-pages/git-pages:0.9.1@sha256:bbcdd603ef3d3dc66aa254479b255674e51286921c02e9f6569dc188f8756594
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
