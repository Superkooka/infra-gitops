apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: forge
spec:
  interval: 1h
  chart:
    spec:
      chart: gitea
      version: "12.5.0"
      sourceRef:
        kind: HelmRepository
        name: gitea-helm-repository
        namespace: flux-system
  values:
    gitea:
      admin:
        username: admin

    persistence:
      enabled: true
      size: 20Gi

    postgresql-ha:
      enabled: true  # SHOULD BE CHANGED