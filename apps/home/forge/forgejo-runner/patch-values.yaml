apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forge
spec:
  template:
    spec:
      containers:
        - name: forgejo-runner
          volumeMounts:
            - name: runner-secret
              mountPath: /etc/runner-secret
              readOnly: true
        - name: dind
          env:
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dhi-registry
                  key: username

            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dhi-registry
                  key: password
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until docker info >/dev/null 2>&1; do
                      sleep 1
                    done

                    printf '%s' "$REGISTRY_PASSWORD" | \
                      docker login \
                        -u "$REGISTRY_USERNAME" \
                        --password-stdin
      volumes:
        - name: runner-data
          # emptyDir: null
          persistentVolumeClaim:
            claimName: forgejo-runner-data-pvc
        - name: runner-secret
          secret:
            secretName: runner-secret
