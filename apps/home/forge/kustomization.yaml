apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/forge
  - forgejo/admin-user-secret.yaml
  - forgejo/gpg-key-secret.yaml
  - forgejo/internal-ssh-key-secret.yaml
  - forgejo/databaseclaim.yaml
  - forgejo/volumes.yaml
  - forgejo/ingress.yaml
  - perforce/volume.yaml
  - perforce/ingress.yaml
patches:
  - path: forgejo/patch-values.yaml
    target:
      kind: HelmRelease
      name: forgejo
  - path: perforce/deployment-patch.yaml
    target:
      kind: Deployment
      name: perforce-server
