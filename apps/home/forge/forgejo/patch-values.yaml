apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forge
spec:
  valuesFrom:
    - kind: Secret
      name: forgejo-database-rw-secret
      valuesKey: host
      targetPath: gitea.config.database.HOST
    - kind: Secret
      name: forgejo-database-rw-secret
      valuesKey: database
      targetPath: gitea.config.database.NAME
    - kind: Secret
      name: forgejo-database-rw-secret
      valuesKey: username
      targetPath: gitea.config.database.USER
    - kind: Secret
      name: forgejo-database-rw-secret
      valuesKey: password
      targetPath: gitea.config.database.PASSWD
    - kind: Secret
      name: forgejo-database-rw-secret
      valuesKey: port
      targetPath: gitea.config.database.PORT
    - kind: Secret
      name: forgejo-admin-user-secret
      valuesKey: username
      targetPath: gitea.admin.username
    - kind: Secret
      name: forgejo-admin-user-secret
      valuesKey: password
      targetPath: gitea.admin.password
    - kind: Secret
      name: forgejo-admin-user-secret
      valuesKey: email
      targetPath: gitea.admin.email

  values:
    image:
      tag: 15.0.3-rootless
      digest: sha256:e7a59d193ad5e8bde19cffc68f26ee00e77a5b0014e95433eed5038f0c3888da
      rootless: true

    persistence:
      enabled: true
      create: false
      claimName: forgejo-data-pvc

    gitea:
      config:
        server:
          ROOT_URL: https://forge.superkooka.com/
          DOMAIN: forge.superkooka.com
          SSH_DOMAIN: forge.superkooka.com
          LFS_START_SERVER: true
        repository:
          ROOT: /data/git/repositories
          DEFAULT_PRIVATE: true
          DISABLE_STARS: true
        repository.signing:
          SIGNING_KEY: 0423CBB528FD933CA9209313A2E4E72A8571B586
          SIGNING_NAME: Forgejo Instance
          SIGNING_EMAIL: pgp.forgejo@superkooka.com
          INITIAL_COMMIT: pubkey, twofa
          CRUD_ACTIONS: pubkey, twofa
          MERGES: pubkey, twofa
        lfs:
          PATH: /data/git/lfs
    signing:
      enabled: true
      gpgHome: /data/git/.gnupg
      existingSecret: forgejo-gpg-key
