apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-helm-release
  namespace: monitoring
spec:
  values:
    image:
      tag: 12.3.3
      sha: ...

    admin:
      existingSecret: ""
      userKey: admin-user
      passwordKey: admin-password

    plugins: 
      - ...

    grafana.ini:
      plugins:
        enabled: false

      server:
        domain: grafana.superkooka.com
        root_url: "%(protocol)s://%(domain)s"
