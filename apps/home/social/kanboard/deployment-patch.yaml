apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard
spec:
  template:
    spec:
      containers:
        - name: kanboard
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: kanboard-user-secret
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: kanboard-user-secret
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: kanboard-user-secret
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kanboard-user-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kanboard-user-secret
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          volumeMounts:
            - name: kanboard-data
              mountPath: /var/www/app/data
            - name: kanboard-plugins
              mountPath: /var/www/app/plugins
      volumes:
        - name: kanboard-data
          persistentVolumeClaim:
            claimName: kanboard-data-pvc
        - name: kanboard-plugins
          persistentVolumeClaim:
            claimName: kanboard-plugins-pvc
