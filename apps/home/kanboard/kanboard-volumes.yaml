apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanboard-data-pvc
  namespace: kanboard
  annotations:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanboard-plugins-pvc
  namespace: kanboard
  annotations:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
