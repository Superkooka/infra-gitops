apiVersion: postgres.operator.superkooka.com/v1beta1
kind: DatabaseClaim
metadata:
  name: kanboard-databaseclaim
  namespace: kanboard
spec:
  instanceRef:
    name: main-postgresql-instance
    namespace: database
  database: kanboard
  schemas:
    - name: public
  roles:
    - name: kanboard-rw
      schemas:
        public:
          permissions: [CONNECT, CREATE, SELECT, INSERT, UPDATE, DELETE]
  users:
    - name: kanboard-user
      roles: [kanboard-rw]
      secretName: kanboard-user-secret
