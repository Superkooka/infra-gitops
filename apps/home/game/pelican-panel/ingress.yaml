apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pelican-panel
  namespace: game
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-real-ip@kubernetescrd,game-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pelican.superkooka.com
      secretName: pelican-panel-tls
  rules:
    - host: pelican.superkooka.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pelican-panel-service
                port:
                  number: 80
