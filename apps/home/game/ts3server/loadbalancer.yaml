# Exposed through a dedicated ServiceLB instead of Traefik: Traefik's UDP
# proxy would hide the client IP from ts3server (bans, anti-flood, logs).
# `externalTrafficPolicy: Local` keeps the real source IP, like the Traefik
# Service itself. ServerQuery (10011) stays on the internal ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: ts3server-lb
  namespace: game
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: ts3server
  ports:
    - name: voice
      port: 9987
      targetPort: 9987
      protocol: UDP
    - name: filetransfer
      port: 30033
      targetPort: 30033
      protocol: TCP
