apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookatlas-data-pvc
  namespace: game
  annotations:
    recurring-job-group.longhorn.io/default: enabled
spec:
  persistentVolumeReclaimPolicy: Retain
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
