apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discord-quote-bot-data-pvc
  namespace: media
  annotations:
    recurring-job-group.longhorn.io/default: enabled
spec:
  persistentVolumeReclaimPolicy: Retain
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Mi
