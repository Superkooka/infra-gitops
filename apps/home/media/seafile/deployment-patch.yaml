apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: media
spec:
  template:
    spec:
      containers:
        - name: seafile
          env:
            - name: SEAFILE_SERVER_HOSTNAME
              value: "seafile.superkooka.com"
            - name: SEAFILE_SERVER_LETSENCRYPT
              value: "false"
            - name: FILE_SERVER_ROOT
              value: "https://seafile.superkooka.com/seafhttp"
            - name: SERVICE_URL
              value: "https://seafile.superkooka.com/seafhttp"
            - name: MEDIA_URL
              value: "https://seafile.superkooka.com/"
            - name: TIME_ZONE
              value: "Europe/Paris"

            - name: INIT_SEAFILE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: seafile-admin-secret
                  key: email
            - name: INIT_SEAFILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-admin-secret
                  key: password

            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile-admin-secret
                  key: jwt

            - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-mariadb-secret
                  key: root-password
            - name: SEAFILE_MYSQL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: seafile-mariadb-secret
                  key: user
            - name: SEAFILE_MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-mariadb-secret
                  key: password

          volumeMounts:
            - name: seafile-data
              mountPath: /shared

        - name: mariadb
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-mariadb-secret
                  key: root-password
            - name: MYSQL_DATABASE
              value: seafile_db
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: seafile-mariadb-secret
                  key: user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-mariadb-secret
                  key: password

          volumeMounts:
            - name: seafile-mariadb
              mountPath: /var/lib/mysql

      volumes:
        - name: seafile-data
          persistentVolumeClaim:
            claimName: seafile-data-pvc
        - name: seafile-mariadb
          persistentVolumeClaim:
            claimName: seafile-mariadb-pvc
