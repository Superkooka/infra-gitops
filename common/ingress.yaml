kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: ingress
  namespace: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

spec:
  rules:
    - host: "gitea.superkooka.com"
      http:
        paths:
          - pathType: ImplementationSpecific
            backend:
              service:
                name: traefik-helm-release
                port:
                  name: web