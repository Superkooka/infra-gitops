apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik-helm-release
  namespace: traefik
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: ">=20.8.0 <20.9.0"
      sourceRef:
        kind: HelmRepository
        name: traefik-helm-repository
        namespace: traefik
      interval: 1m
  upgrade:
    remediation:
      remediateLastFailure: true
  values:
    deployment:
      replicas: 2
    ports:
      websecure:
        expose: false
    logs:
      access:
        enabled: true
    service:
      type: "NodePort"
      annotations:
        cloud.google.com/backend-config: '{"default": "traefik-v2-backend-cfg"}'
    ingressClass:
      enabled: false