apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-daily
  namespace: longhorn
spec:
  cron: "0 2 * * *" # daily
  task: snapshot
  groups:
    - default
  retain: 7
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn
spec:
  cron: "0 3 * * 0" # weekly
  task: backup
  groups:
    - default
  retain: 4
  concurrency: 1