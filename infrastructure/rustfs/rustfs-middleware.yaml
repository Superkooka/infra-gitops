apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: rustfs
spec:
  basicAuth:
    secret: basic-auth-secret
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-noslash
  namespace: rustfs
spec:
  redirectRegex:
    permanent: true
    regex: ^(https?://[^/]+/rustfs)$
    replacement: ${1}/
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: replacepath-rustfs-ui
  namespace: rustfs
spec:
  replacePathRegex:
    regex: ^/rustfs/(.*)
    replacement: /${1}