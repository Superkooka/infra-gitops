apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: kube-system
spec:
  basicAuth:
    secret: basic-auth-secret
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: replacepath-traefik-ui
  namespace: kube-system
spec:
  replacePathRegex:
    regex: ^/traefik/(.*)
    replacement: /${1}
