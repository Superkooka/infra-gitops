apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      traefik:
        expose: true    
      websecure:
        http3:
          enabled: true
          advertisedPort: 443

    api:
      dashboard: false

    ingressRoute:
      dashboard:
        enabled: false
