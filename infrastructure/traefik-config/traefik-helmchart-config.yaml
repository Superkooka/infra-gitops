apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    api:
      basePath: /traefik

    service:
      spec:
        externalTrafficPolicy: Local

    ports:
      perforce:
        port: 1666
        expose:
          default: true
        exposedPort: 1666
        protocol: TCP

      sftp:
        port: 2022
        expose:
          default: true
        exposedPort: 2022
        protocol: TCP

      ssh:
        port: 2023
        expose:
          default: true
        exposedPort: 2023
        protocol: TCP

      fivem-game-tcp:
        port: 30120
        expose:
          default: true
        exposedPort: 30120
        protocol: TCP

      fivem-game-udp:
        port: 30120
        expose:
          default: true
        exposedPort: 30120
        protocol: UDP
    ingressRoute:
      dashboard:
        enabled: false
