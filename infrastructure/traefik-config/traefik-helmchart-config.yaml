apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    api:
      basePath: /traefik

    # scraped by infrastructure/monitoring-config/traefik-podmonitor.yaml
    metrics:
      prometheus:
        addRoutersLabels: true

    service:
      spec:
        externalTrafficPolicy: Local
      single: false

    ports:
      perforce:
        port: 1666
        expose:
          default: true
        exposedPort: 1666
        protocol: TCP

      sftp:
        port: 2022
        expose:
          default: true
        exposedPort: 2022
        protocol: TCP

      ssh:
        port: 2023
        expose:
          default: true
        exposedPort: 2023
        protocol: TCP

      # A TCP and a UDP port must never share the same `port` in the same
      # object: Helm upgrades use a strategic merge patch keyed on the port
      # number only, so one of the two entries gets dropped
      # (kubernetes/kubernetes#47249). That is why dns-udp listens on 5354
      # inside the pod, and why `service.single: false` splits TCP and UDP
      # into the `traefik` and `traefik-udp` Services.
      dns-udp:
        port: 5354
        expose:
          default: true
        exposedPort: 53
        protocol: UDP

      dns-tcp:
        port: 53
        expose:
          default: true
        exposedPort: 53
        protocol: TCP

    ingressRoute:
      dashboard:
        enabled: false
