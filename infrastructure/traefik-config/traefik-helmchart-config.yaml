apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    experimental:
      http3:
        enabled: true

    ports:
      websecure:
        http3:
          enabled: true
        advertisedPort: 443

    api:
      basePath: /traefik
    ingressRoute:
      dashboard:
        enabled: false
