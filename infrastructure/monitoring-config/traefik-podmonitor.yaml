# traefik is deployed by k3s (HelmChart kube-system/traefik), metrics are
# served on the `metrics` entrypoint (:9100) which is not exposed by a Service
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
