# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: light-k8s-postgres-operator
  namespace: database
spec:
  interval: 1h
  chart:
    spec:
      chart: light-k8s-postgres-operator
      version: "1.0.0-alpha.2"
      sourceRef:
        kind: HelmRepository
        name: github-superkooka
        namespace: flux-system
      interval: 1h
  values:
    operator:
      image:
        tag: "1.0.0-alpha.3"
      namespace: database

    postgresql:
      enabled: true

      auth: {}

      primary:
        persistance:
          existingClaim: postgres-data-pvc

  valuesFrom:
    - kind: ConfigMap
      name: postgresql-config
      valuesKey: values.yaml
      optional: true
