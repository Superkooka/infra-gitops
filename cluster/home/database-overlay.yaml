apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-overlay
  namespace: flux-system
spec:
  dependsOn:
    - name: database
  interval: 10m
  path: ./cluster/home/database-overlay
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
